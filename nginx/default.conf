# WebSocket upgrade: hanya kirim Connection: upgrade saat klien memang meminta
# upgrade (handshake), selain itu "close" — supaya proxy HTTP biasa di bawah
# tidak ikut memaksa koneksi upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    # Dynamic DNS resolution untuk upstream app (Bug #6).
    # Docker embedded DNS (127.0.0.11) + variable di fastcgi_pass membuat nginx
    # re-resolve nama service per TTL (10s) — sehingga recreate container app
    # tidak lagi membutuhkan restart nginx manual (menghindari HTTP 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Dinaikkan selaras post_max_size PHP (lihat Dockerfile) untuk upload ZIP restore
    # sistem (DB dump + seluruh storage) di halaman admin/system/backup & upload
    # workspace multi-file besar.
    client_max_body_size 1G;

    charset utf-8;

    # Fix #2: pastikan .mjs disajikan sebagai application/javascript
    # (ES module), bukan application/octet-stream.
    types {
        application/javascript js mjs;
        text/css css;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets (no build step, so mostly CSS/JS from CDN)
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @static_404;
    }

    # 404 dari aset statis TIDAK boleh di-cache (CF/browser menyimpan 404
    # max-age 4-7 hari => foto profil tampak rusak lama setelah file pulih).
    location @static_404 {
        add_header Cache-Control "no-cache, max-age=0" always;
        access_log off;
        return 404;
    }

    # PDF.js worker (.mjs) — MIME sudah benar dari types server-level.
    # Beri no-cache agar browser tidak memakai versi stale (MIME salah) pasca-deploy.
    location ~* /pdfjs/.*\.mjs$ {
        add_header Cache-Control "no-cache, max-age=0" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # ---------------------------------------------------------------------
    # WebSocket Reverb (protokol Pusher) — browser klien.
    #
    # Tanpa blok ini, handshake `GET /app/<key>` jatuh ke `location /` lalu
    # diteruskan ke Laravel: jawabannya 404 (atau 502 saat PHP-FPM sedang
    # recreate) dan notifikasi realtime TIDAK PERNAH sampai ke browser —
    # padahal event-nya sudah berhasil di-broadcast dari sisi server.
    #
    # `proxy_pass` memakai variable ($reverb_upstream) supaya nginx memakai
    # resolver dinamis di atas: IP container reverb ikut berubah saat recreate
    # tanpa perlu restart nginx.
    # ---------------------------------------------------------------------
    location ~ ^/(app|apps)/ {
        set $reverb_upstream logbook-ta-reverb:8080;
        proxy_pass http://$reverb_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Koneksi WS itu long-lived: jangan diputus, jangan di-buffer.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~ \.php$ {
        # Gunakan variable (bukan literal) agar nginx memakai resolver dinamis
        # di atas — re-resolve nama service per TTL saat IP container berubah.
        set $app_upstream logbook-ta-app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Selaras max_execution_time PHP (Dockerfile) supaya nginx tidak memutus
        # koneksi (502) saat mysqldump/mysql/zip pada system backup/restore masih berjalan.
        fastcgi_read_timeout 1800s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
